title: CRC访视风险助手
description: 面向CRC的一线访视风险提醒与EDC录入辅助MVP：CRC手动上传或Excel导入检测报告后，平台后端接入CTCAE和医学专业知识知识库，AI输出预识别标注与复核证据包，辅助CRC完成线下标注和EDC回填。
userRoles:
- CRC
- CRC组长
userPains:
- CRC在现场同时处理访视执行、资料补传、复核证据整理、AE/SAE/CM线索确认和状态更新，容易遗漏下一步动作。
- 受试者状态异常预判依赖个人经验和口头确认，缺少结构化证据，异常响应可能延迟。
- 风险提醒如果只提示有风险但不给出动作、依据和关闭标准，CRC仍需自行判断优先级。
- 研究者复核前的监测值、症状变化、检测指标变化和规则依据需要人工整理，复核后留痕容易断裂。
- AE/SAE/CM升级判断涉及临床信息、项目规则和SLA时限，人工判断压力高，漏报或迟报风险高。
- 多角色协同暂不做直接使用端，但CRC仍需要知道其他角色责任边界、升级规则和处置模板。
aiInput:
- CRC打开今日访视任务或选中某个受试者访视记录。
- 系统带入受试者监测值、症状变化、检测指标变化、既往访视表现和资料上传状态。
- 系统带入访视风险等级、风险命中规则、SOP依据和待办事项。
- CRC补充现场观察、沟通记录、CRC线下确认结论或需要判断的问题。
- 系统带入AE/SAE/CM线索、项目上报规则、SLA时限和材料准备要求。
dataKnowledge:
- 项目方案、SOP、高频风险规则、访视窗口规则和例外条件。
- 受试者访视时间线、执行记录、资料上传状态、复核状态和关闭记录。
- 历史偏差案例、CAPA案例、客户质疑记录、相似风险处置模板。
- AE/SAE/CM判断规则、上报SLA、材料清单和历史上报结果。
- 研究者复核记录、症状描述标准化词表、检测指标变化记录和临床异常阈值。
- 角色责任知识库、升级路径、责任边界和多角色处置模板。
workflow:
- 汇聚上下文：按受试者、访视、中心和项目自动汇总时间线、资料状态、受试者状态和历史风险。
- 识别风险信号：抽取资料缺失、访视超窗、症状变化、检测指标变化、异常监测值和AE/SAE/CM线索。
- 匹配规则依据：检索项目SOP、风险规则、上报SLA和相似案例，形成可追溯的风险解释。
- 生成辅助判断：输出异常预判、研究者复核触发建议、AE/SAE/CM升级提示和置信度说明。
- 转译下一步动作：把风险判断转为CRC可执行任务、优先级、截止时间、所需资料和关闭标准。
- 生成复核证据包：自动整理研究者复核材料、关键指标变化、症状摘要、规则依据和待确认问题清单。
- 记录反馈闭环：采集CRC采纳、忽略、修正、误报、漏报和任务关闭结果，用于规则和模型迭代。
modelUsage:
- 文本大模型用于访视记录、沟通记录、SOP条款和历史案例的语义理解与摘要生成。
- RAG检索用于从项目方案、SOP、AE/SAE/CM规则和案例知识库中返回可引用依据。
- 规则引擎用于访视窗口、资料完整性、SLA倒计时、升级条件和关闭标准判断。
- 预测模型或评分卡用于受试者状态异常预判、访视级风险评分和贡献因子解释。
- 信息抽取模型用于识别症状、检测指标变化、检查数值、AE/SAE/CM线索和责任角色。
- 人机协同护栏用于限制AI只做提示、证据整理和建议，不替代CRC临床判断或最终合规结论。
aiOutput:
- CRC今日风险待办清单，包含优先级、原因、下一步动作、截止时间和关闭标准。
- 受试者状态异常预判卡，包含异常线索、规则依据、建议复核对象和置信度说明。
- 复核证据包，包含监测值变化、症状变化、检测指标变化、历史访视对比和待确认问题。
- AE/SAE/CM升级提示卡，包含疑似事件线索、SLA倒计时、材料清单和人工确认入口。
- 资料完整性提醒，包含缺失文件、版本不一致、逾期风险和补传建议。
- 相似案例与处置模板，包含历史案例、推荐动作、注意事项和适用边界。
- 反馈标注结果，包含提醒是否有效、是否误报漏报、CRC修正原因和后续优化线索。
tools:
- CRC手动上传或Excel导入检测报告、访视记录和源资料。
- 本地Web工具接入CTCAE知识库、医学专业知识库和项目SOP规则库。
- CTMS读取访视计划、访视窗口、执行状态和中心任务（可选，不影响核心MVP）。
- eTMF或文档库读取资料清单、上传文件、复核状态和归档记录（可选）。
- 风险台账写入风险等级、提醒记录、处置状态、关闭证据和反馈标签。
- SOP知识库和案例知识库提供规则检索、条款引用、相似案例和处置模板。
- 移动端或CRC Copilot推送待办卡片、复核证据包和一键反馈。
productType:
- 本地Web工具或嵌入CRC Copilot/CTMS侧边栏的访视风险助手，CRC手动上传受试者检测资料即可看到风险卡和下一步动作。
- 移动端轻量待办卡片，支持确认、修正、暂缓、生成复核证据包和标注误报漏报。
- 后台知识库配置台，仅供CRC组长维护规则、案例和角色责任知识，不面向多角色直接协同。
userGains:
- CRC下一步动作判断耗时下降40%以上。
- 高风险访视提前识别率提升30%以上。
- 研究者复核材料准备时间下降50%以上。
- 资料缺失和补传返工次数下降30%以上。
- AE/SAE/CM疑似线索进入人工确认的及时率提升至95%以上。
- 风险提醒有效性可度量率达到90%以上。
- MVP阶段不以客户/申办方门户体验为主要指标，优先衡量CRC采纳率、任务关闭率和辅助判断准确性。
