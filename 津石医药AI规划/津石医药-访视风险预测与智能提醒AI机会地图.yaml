analysis_conclusion:
  coverage_statement: 本地图基于'医院系统接口封闭、商务周期长'的约束重构：剔除面向医生/医院系统的辅助诊疗和流程优化场景，聚焦CRC行政与数据效率提升。保留的12个AI机会点全部落在无需系统对接的CRC独立工具侧，其中CRC核心事务6个、CRC事务性工作6个，无落点留在医院系统依赖象限。
  implementation_sequence:
  - 第一优先级（CRC核心事务）：资料完整性与时效风险预警、CRC下一步动作智能提醒、受试者状态异常预判、AE/SAE/CM升级判断与SLA倒计时。
  - 第二优先级（CRC核心事务+事务性辅助）：访视事件时间线与风险证据图谱、访视级风险评分与贡献因子解释。
  - 第三优先级（CRC事务性工作）：提醒有效性反馈、EDC录入辅助与复核证据包整理、相似风险案例与处理模板推荐、风险案例知识库与训练题生成、SOP语义规则匹配引擎、受试者沟通话术辅助。
  - 核心结论：高价值机会全部落在无需医院HIS/EMR对接的CRC独立工具侧；任何需医生决策或医院系统集成的方向因商务周期长、接口封闭，本轮暂缓。
  mvp_statement: 本轮MVP仅保留1条主场景链（opp_03受试者状态异常预判→opp_11 AE/SAE/CM升级判断），由opp_07动作提醒与opp_10 EDC录入辅助作为支撑能力；opp_02资料完整性作为备选第2分支；其余机会点（事件时间线/风险评分/SOP语义匹配/相似案例/反馈标注/训练题/沟通话术）全部列入路线图，待主场景数据与反馈稳定后再评估。
