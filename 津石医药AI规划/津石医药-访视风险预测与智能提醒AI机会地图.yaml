title: 津石医药-访视风险预测与智能提醒AI机会地图
company: 津石医药
business_flow: 访视风险预测与智能提醒价值流
analysis_scope: 基于《津石医药-可服务体验提升业务流程深度分析.html》中的访视风险预测与智能提醒价值流，围绕风险信号采集、规则评分解释、智能提醒编排、临床复核闭环、客户价值与知识回流五个阶段，识别可应用人工智能技术的场景机会。
quadrant_definition:
  high_value_high_priority: CRC核心事务（高价值·易落地）
  high_value_low_priority: 医院系统依赖（高价值·难落地）
  low_value_high_priority: CRC事务性工作（低价值·易落地）
  low_value_low_priority: 避免（低价值·难落地）
stages:
- id: stage_1
  order: 1
  name: 风险信号采集与证据建模
  objective: 将访视计划、执行记录、资料上传、受试者状态和沟通记录转化为可计算、可追溯的风险证据。
  nodes:
  - id: node_1
    name: 访视事件时间线生成
    layer: L2流程节点
    primary_roles:
    - CRC
    - 项目经理
    touchpoints:
    - CTMS
    - 风险台账
    - 进度看板
    - 中心沟通记录
    decision_complexity: 中
    pain_points:
    - 访视事实分散在CTMS、文档库、沟通群和个人记录中，难以形成统一时间线。
    - 风险通常在问题显性化后才被发现，错过访视前或访视中的干预窗口。
    efficiency_bottlenecks:
    - 项目经理需要人工跨系统还原预约、到访、采样、资料上传、复核和沟通动作。
    - 节点状态口径不统一，导致现场事实确认和风险判断耗时。
    experience_improvement_space:
    - 让项目经理和质控人员看到一条统一的访视事件链。
    - 让CRC减少重复汇报，让客户感知津石对过程风险的主动掌控。
    data_foundation:
      readiness: medium
      available_data:
      - 访视安排
      - 执行记录
      - 资料上传状态
      - 中心沟通记录
      data_gaps:
      - 跨系统事件ID和时间戳尚未统一。
      - 沟通记录中的关键事件需要语义抽取和结构化。
  - id: node_2
    name: 资料完整性信号采集
    layer: L2流程节点
    primary_roles:
    - CRC
    - 质控专员
    touchpoints:
    - eTMF
    - 文档库
    - 自动归档模块
    decision_complexity: 中
    pain_points:
    - 资料完整性问题通常在质控或申办方复核时才暴露。
    - 关键文档准时完整率不稳定，影响申办方复核一次通过率。
    efficiency_bottlenecks:
    - 资料清单、上传状态、复核状态和归档状态需要人工比对。
    - 缺失、过期、版本不一致等问题缺少实时提醒。
    experience_improvement_space:
    - 把检查前集中返工提前到访视过程内处理。
    - 让申办方看到实时完整性状态，而不是事后追问。
    data_foundation:
      readiness: high
      available_data:
      - 访视资料清单
      - 已上传文件
      - 复核状态
      - 导出归档记录
      data_gaps:
      - 不同项目资料模板和命名规则需要标准化映射。
  - id: node_3
    name: 受试者状态风险信号采集
    layer: L2流程节点
    primary_roles:
    - CRC
    - 研究者
    touchpoints:
    - 访视记录表
    - 临床判断备忘
    - AE工作台
    decision_complexity: 高
    pain_points:
    - 临床状态预判依赖个人经验和口头反复确认，缺少结构化证据。
    - 异常响应可能延迟，受试者体验、安全感和合规追溯都受到影响。
    efficiency_bottlenecks:
    - 症状变化、用药变化和检查数值变化需要人工汇总后再请CRC复核证据整理。
    - AE/SAE/CM线索容易散落在访视记录和沟通记录中。
    experience_improvement_space:
    - 把依赖CRC经验的口头预判变成可留痕的结构化风险输入。
    - 让研究者更快获得需要复核的关键信息。
    data_foundation:
      readiness: medium
      available_data:
      - 受试者监测值
      - 症状变化
      - 用药变化
      - 既往访视表现
      data_gaps:
      - 临床异常阈值和项目方案要求需要结构化。
      - 非结构化症状描述需要标准化术语映射。
- id: stage_2
  order: 2
  name: 风险规则匹配与评分解释
  objective: 将风险信号与项目SOP、历史偏差、AE/SAE/CM规则和中心执行表现匹配，形成可解释的风险等级。
  nodes:
  - id: node_4
    name: 风险规则与SOP匹配
    layer: L2流程节点
    primary_roles:
    - 质控专员
    - 项目经理
    touchpoints:
    - 风险规则库
    - SOP知识库
    decision_complexity: 高
    pain_points:
    - 风险提示缺少规则依据时，一线很难判断是否需要立即处理。
    - 提醒容易被忽略，或者造成过度升级，降低现场使用体验。
    efficiency_bottlenecks:
    - SOP、方案要求和历史偏差没有被拆成机器可匹配的规则。
    - 风险命中依据和下一步动作需要质控专员人工解释。
    experience_improvement_space:
    - 让提醒不仅告诉一线有风险，还解释为什么有风险。
    - 让风险判断从专家口径转为可复用的规则资产。
    data_foundation:
      readiness: medium
      available_data:
      - 访视事件时间线
      - 资料缺失清单
      - 受试者状态风险标签
      - SOP要求
      data_gaps:
      - SOP和方案要求需要结构化为规则、阈值和例外条件。
  - id: node_5
    name: 访视级风险评分
    layer: L2流程节点
    primary_roles:
    - 项目经理
    - 质控专员
    touchpoints:
    - 风险评分模型
    - 质控看板
    decision_complexity: 高
    pain_points:
    - 当前缺少对访视级风险的动态评分和贡献因子解释。
    - 质控资源无法精准投向高风险访视，重大偏差更难提前拦截。
    efficiency_bottlenecks:
    - 过程数据没有被连续监测。
    - 风险等级与现场动作之间没有形成闭环。
    experience_improvement_space:
    - 帮助项目经理和质控团队把资源优先投向最可能影响高质量闭环的访视。
    - 让风险评分具备可解释性，便于一线接受。
    data_foundation:
      readiness: medium
      available_data:
      - 风险命中规则
      - 历史异常记录
      - 中心执行表现
      - CRC负荷状态
      data_gaps:
      - 历史异常样本需要统一标签。
      - 风险评分结果需要与后续处置成效回流。
  - id: node_6
    name: 相似案例与处理模板推荐
    layer: L2流程节点
    primary_roles:
    - 质控专员
    - 培训负责人
    touchpoints:
    - 案例知识库
    - 学习App
    decision_complexity: 中
    pain_points:
    - 风险处置建议依赖资深人员记忆，案例复用效率低。
    - 同类风险在不同中心重复发生，新人处理质量波动大。
    efficiency_bottlenecks:
    - 偏差、CAPA和客户反馈没有按场景和动作标签沉淀。
    - 新人难以快速找到相似处置模板。
    experience_improvement_space:
    - 把资深CRC和质控人员经验变成新人也能调用的行动知识。
    - 降低跨中心处理质量波动。
    data_foundation:
      readiness: medium
      available_data:
      - 风险贡献因子
      - 历史偏差案例
      - CAPA案例
      - 客户质疑记录
      data_gaps:
      - 历史案例缺少统一分类和动作标签。
- id: stage_3
  order: 3
  name: 智能提醒与任务编排
  objective: 将风险评分和规则依据转化为CRC、项目经理、研究者、质控专员可执行的任务提醒。
  nodes:
  - id: node_7
    name: CRC下一步动作提醒
    layer: L2流程节点
    primary_roles:
    - CRC
    touchpoints:
    - CRC Copilot
    - 移动端提醒
    decision_complexity: 中
    pain_points:
    - 提醒如果只停留在风险提示，不能转化为具体动作。
    - CRC仍需自己判断下一步，智能提醒对体验改善有限。
    efficiency_bottlenecks:
    - 风险模型和现场任务编排没有形成一一对应关系。
    - 高压现场中CRC需要同时处理补传、沟通、复核和状态更新。
    experience_improvement_space:
    - 减少CRC在高压现场中自行判断优先级的负担。
    - 把风险提醒变成可执行、可关闭的行动清单。
    data_foundation:
      readiness: high
      available_data:
      - 访视风险等级
      - 规则依据说明
      - 待办事项
      - 现场工作负荷
      data_gaps:
      - 不同风险等级与具体动作模板需要映射。
  - id: node_8
    name: 跨角色协同提醒
    layer: L2流程节点
    primary_roles:
    - CRC
    - 项目经理
    touchpoints:
    - 沟通群
    - 协同待办
    - 客户协同门户
    decision_complexity: 中
    pain_points:
    - 现场问题常靠CRC重复通知各角色推进。
    - 问题处理链路长，异常响应滞后，影响受试者和申办方体验。
    efficiency_bottlenecks:
    - 风险责任归属、通知节奏和升级阈值没有被系统化编排。
    - 多角色任务之间缺少统一状态视图。
    experience_improvement_space:
    - 减少重复通知和责任不清，让风险协同更快进入处理状态。
    - 让申办方看到责任、动作和进度。
    data_foundation:
      readiness: medium
      available_data:
      - 行动提醒
      - 责任角色
      - 升级规则
      - 截止时间
      data_gaps:
      - 不同角色的任务权限、通知偏好和升级路径需要配置。
  - id: node_9
    name: 提醒有效性反馈
    layer: L2流程节点
    primary_roles:
    - CRC
    - 项目经理
    touchpoints:
    - CRC Copilot
    - 风险看板
    decision_complexity: 低
    pain_points:
    - 提醒效果缺少反馈，难以判断哪些提醒真正改善了闭环质量。
    - 提醒过多会造成疲劳，提醒过少又无法提前拦截风险。
    efficiency_bottlenecks:
    - 任务完成、风险结果和规则命中没有形成反馈学习机制。
    - 误报和漏报无法快速进入规则优化。
    experience_improvement_space:
    - 让智能提醒持续变准，而不是一次性规则配置。
    - 降低一线提醒疲劳。
    data_foundation:
      readiness: high
      available_data:
      - 提醒触达记录
      - 任务完成状态
      - 风险结果
      - 用户反馈
      data_gaps:
      - 提醒是否有效需要定义统一标注口径。
- id: stage_4
  order: 4
  name: 临床复核与风险闭环
  objective: 对可能影响受试者安全、AE/SAE/CM上报或重大偏差的风险进行CRC线下复核确认、升级、纠偏和关闭。
  nodes:
  - id: node_10
    name: 临床异常预判与CRC复核证据整理
    layer: L2流程节点
    primary_roles:
    - CRC
    touchpoints:
    - 访视记录表
    - 临床判断备忘
    - 沟通记录
    decision_complexity: 高
    pain_points:
    - 受试者异常是否需要CRC复核证据整理常依赖口头反复确认。
    - 异常响应可能延迟，记录不完整会影响合规追溯。
    efficiency_bottlenecks:
    - CRC复核证据整理前的信息整理和证据汇总依赖人工。
    - 复核结论、后续行动和留痕记录容易断裂。
    experience_improvement_space:
    - 让受试者异常响应更快，且每次判断都有证据和留痕。
    - 降低CRC和研究者之间的反复确认成本。
    data_foundation:
      readiness: medium
      available_data:
      - 受试者状态风险标签
      - 受试者监测值
      - 症状变化
      - 风险规则依据
      data_gaps:
      - CRC复核证据结论需要结构化记录。
  - id: node_11
    name: AE/SAE/CM升级判断
    layer: L2流程节点
    primary_roles:
    - CRC
    - 项目经理
    - 质控专员
    touchpoints:
    - AE/SAE/CM工作台
    - 风险台账
    decision_complexity: 高
    pain_points:
    - AE/SAE/CM升级判断需要结合临床信息、项目规则和时限要求，人工判断压力高。
    - 漏报或迟报会直接影响质量合规与客户信任。
    efficiency_bottlenecks:
    - 安全事件线索、上报SLA和资料准备清单没有被统一联动。
    - 人工判断时容易遗漏时限和材料要求。
    experience_improvement_space:
    - 降低漏报、迟报和资料不完整风险。
    - 让项目经理、质控和申办方看到明确的升级依据与倒计时。
    data_foundation:
      readiness: medium
      available_data:
      - CRC复核证据确认记录
      - AE/SAE/CM线索
      - SLA规则
      - 项目上报要求
      data_gaps:
      - 事件线索与上报规则之间需要精细映射。
  - id: node_12
    name: 纠偏动作闭环跟踪
    layer: L2流程节点
    primary_roles:
    - 项目经理
    - 质控专员
    touchpoints:
    - 风险台账
    - CAPA记录
    - 客户协同门户
    decision_complexity: 中
    pain_points:
    - 风险升级后缺少自动跟踪和闭环提醒。
    - 风险处理容易拖延，客户难以及时感知津石的过程控制能力。
    efficiency_bottlenecks:
    - 风险台账与客户同步、质控复核、CRC待办没有打通。
    - 关闭证据和CAPA经验条目依赖人工沉淀。
    experience_improvement_space:
    - 让风险不只被发现，还能按时关闭并沉淀为组织能力。
    - 提升客户对津石过程控制能力的透明感。
    data_foundation:
      readiness: medium
      available_data:
      - 升级判断结论
      - 纠偏动作
      - 责任人
      - 关闭证据
      data_gaps:
      - 关闭标准、证据模板和CAPA标签需要标准化。
- id: stage_5
  order: 5
  name: 客户价值呈现与知识回流
  objective: 把风险预测、提醒响应、纠偏结果和复盘经验转化为客户可感知的服务价值，以及内部可复用的知识资产。
  nodes:
  - id: node_13
    name: 项目风险汇报（本轮暂缓：客户/申办方侧）
    layer: L2流程节点
    primary_roles:
    - 项目经理
    touchpoints:
    - 客户协同门户
    - 阶段汇报
    decision_complexity: 中
    pain_points:
    - 客户汇报依赖人工拼接多个系统状态。
    - 客户感知不到实时控制能力，协作体验和信任下降。
    efficiency_bottlenecks:
    - 项目过程数据没有被产品化呈现。
    - 风险、进展、纠偏动作和关闭状态需要人工整理为客户语言。
    experience_improvement_space:
    - 本轮MVP不优先建设客户协同门户，待CRC闭环数据稳定后再评估。
    data_foundation:
      readiness: high
      available_data:
      - 风险关闭记录
      - 项目进度状态
      - 纠偏动作
      - 访视闭环指标
      data_gaps:
      - 内部运营语言需要转换为客户可理解的汇报语言。
  - id: node_14
    name: 风险运营指标复盘
    layer: L2流程节点
    primary_roles:
    - 运营负责人
    - 质控负责人
    touchpoints:
    - 经营看板
    - 质控看板
    decision_complexity: 中
    pain_points:
    - 风险复盘缺少经营视角，难以转化为资源配置和培训优先级。
    - 培训和质控投入不够精准，核心CRC成长路径不清晰。
    efficiency_bottlenecks:
    - 风险结果没有沉淀为中心画像、CRC画像和能力标签。
    - 复盘动作容易停留在单点案例层面。
    experience_improvement_space:
    - 把单点风险处置升级为中心和人员能力治理。
    - 让运营负责人看到可行动的资源配置和培训建议。
    data_foundation:
      readiness: medium
      available_data:
      - 风险评分分布
      - 提醒触达记录
      - 风险关闭时效
      - 访视闭环结果
      data_gaps:
      - CRC画像、中心画像和能力标签需要长期沉淀。
  - id: node_15
    name: 风险案例沉淀与训练
    layer: L2流程节点
    primary_roles:
    - 培训负责人
    - 质控负责人
    touchpoints:
    - 知识库
    - 学习App
    decision_complexity: 中
    pain_points:
    - 经验沉淀常停留在复盘文档，不能直接进入一线执行。
    - 新人上手慢，同类问题在不同中心重复发生。
    efficiency_bottlenecks:
    - 知识库没有与具体场景、动作和提醒规则绑定。
    - 案例难以转化为训练题、处置模板和规则优化建议。
    experience_improvement_space:
    - 让风险管理能力从少数骨干经验扩展为一线团队可复制的标准动作。
    - 把客户质疑、CAPA经验和复核记录转化为训练资产。
    data_foundation:
      readiness: medium
      available_data:
      - 风险案例
      - 复核记录
      - 客户质疑记录
      - CAPA经验条目
