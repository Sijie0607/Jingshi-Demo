insights:
- MVP主线应以'CRC下一步动作智能提醒'为入口，串联'资料完整性与时效风险预警''受试者状态异常预判''EDC录入辅助与复核证据包整理''AE/SAE/CM升级判断与SLA倒计时'，形成CRC一线独立工具闭环。
- 受试者状态异常预判边界限定为：CRC上传/导入检测报告后，AI基于CTCAE和医学知识库输出预识别标注与复核建议，CRC在线下获取CRC线下确认后再回填EDC，不替代临床判断。
- 提醒有效性反馈、相似风险案例与处理模板推荐、风险案例知识库与训练题生成、SOP语义规则匹配引擎作为CRC动作提醒和辅助判断的支撑能力同步建设。
- 删除原因：医院系统接口封闭、商务周期长，多角色协同、客户视角摘要、运营画像、CAPA闭环、访视周报、跨项目规则迁移等需系统对接或面向非CRC角色的功能本轮暂缓。
