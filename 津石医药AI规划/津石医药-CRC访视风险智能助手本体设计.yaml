title: CRC访视风险助手本体
domain: SMO访视
scenario_description: 面向CRC的访视风险提醒与EDC录入辅助MVP：CRC手动上传或Excel导入检测报告后，平台后端接入CTCAE和医学专业知识知识库，对检测报告扫描结果进行预识别标注并返回CRC；CRC依据返回的预识别标注对线下检测报告表进行标注，经研究者线下确认后将AI预判正确的内容用于病例填写。
target_agent_role: CRC风险辅助Agent
entities:
- id: patient
  name: 受试者(Patient)
  type: core
  description: 参加临床试验的受试者，是访视、检测和资料的主体；MVP中以脱敏摘要形式提供上下文，不管理其医学结论
  attributes:
  - name: subject_id
    type: string
    description: 受试者编号
  - name: enrollment_date
    type: datetime
    description: 入组日期
  - name: current_status
    type: string
    description: 当前访视状态摘要
  key_distinctions:
  - 受试者信息需脱敏处理
  - AI只管理访视和资料，不输出医学结论
- id: subject_visit
  name: 受试者访视
  type: core
  description: 某受试者在某项目某中心的一次访视实例，是风险提醒、证据整理与动作闭环的主入口；"今日风险队列"即访视实例按状态与风险分的过滤视图
  attributes:
  - name: visit_status
    type: enum
    values:
    - scheduled
    - arrived
    - executed
    - pending_review
    - closed
    description: 访视进展状态
  - name: visit_window
    type: string
    description: 方案要求的访视窗口
  - name: subject_status
    type: string
    description: 受试者当前状态摘要
  - name: risk_score
    type: number
    description: 访视级风险评分（规则+资料完整性），仅作优先级排序，不等于医学严重程度
  - name: sla_deadline
    type: datetime
    description: 当前最紧急待办的上报或关闭截止时间
  key_distinctions:
  - 计划访视不等于受试者已到访
  - 现场执行完成不等于资料齐全
  - 受试者异常线索不等于临床判定
  - 风险评分不等于医学严重程度
- id: source_document
  name: 访视资料
  type: reference
  description: 化验单、检查单、访视记录等资料证据来源；一次访视可有多份资料，一份资料含多个检验指标
  attributes:
  - name: document_type
    type: string
    description: 文件类型
  - name: document_status
    type: enum
    values:
    - expected
    - uploaded
    - missing
    - reviewed
    - archived
    description: 文件状态
  - name: version
    type: string
    description: 文件版本
  key_distinctions:
  - 资料已上传不等于资料已复核
  - 资料完整不等于内容无风险
  - 资料缺失需区分未产生和未上传
- id: lab_indicator
  name: 检验指标
  type: reference
  description: 从检查单/化验单中抽取出的原始检验项目与测量值（如体温、中性粒细胞绝对值、血小板），是风险判断的事实证据层，不属于事件对象
  attributes:
  - name: indicator_code
    type: string
    description: 检验项目编码（如 ANC/PLT/ALT/TEMP）
  - name: indicator_name
    type: string
    description: 检验指标名称
  - name: value
    type: string
    description: 测量值及单位
  - name: reference_range
    type: string
    description: 参考范围
  - name: trend
    type: string
    description: 与既往访视对比的趋势变化
  - name: ctcae_candidate
    type: string
    description: AI对照CTCAE/阈值输出的候选等级，仅作候选映射，不是最终定级
  - name: confidence
    type: number
    description: AI识别与映射置信度
  key_distinctions:
  - 检验指标是事实证据，不是风险信号，也不是领域事件
  - CTCAE候选等级是AI映射结果，不是最终医学定级
  - 单指标异常不等于受试者风险，需结合症状与其他指标综合判断
- id: risk_signal
  name: 风险信号
  type: core
  description: 由检验指标、症状、时间窗或沟通记录等事实推导出的可解释风险线索；是派生解释层，不是事件对象
  attributes:
  - name: signal_type
    type: enum
    values:
    - subject_abnormal
    - ae_sae_cm
    - document_missing
    description: 风险信号类型（本轮MVP聚焦subject_abnormal与ae_sae_cm，document_missing列入路线图）
  - name: severity
    type: enum
    values:
    - low
    - medium
    - high
    - critical
    description: 风险严重等级
  - name: confidence
    type: number
    description: AI识别置信度
  - name: evidence_refs
    type: list
    description: 支撑该信号的事实证据引用（检验指标、症状记录、规则依据）
  key_distinctions:
  - 风险信号是线索，不是最终判断
  - 风险信号由检验指标等事实支撑产生，不是事件对象
  - 高置信度不等于无需人工确认
  - 资料风险不等于受试者安全风险
- id: review_packet
  name: 复核证据包
  type: core
  description: 供CRC向研究者发起线下复核的人机协同材料包，包含事实、变化、依据和待确认问题清单
  attributes:
  - name: packet_status
    type: enum
    values:
    - draft
    - ready
    - submitted
    - confirmed
    - revised
    description: 证据包状态
  - name: evidence_summary
    type: string
    description: 关键证据摘要
  - name: question_list
    type: list
    description: 待研究者线下确认的问题清单（可勾选回填）
  key_distinctions:
  - 证据包只整理事实，不输出判定
  - 证据包ready不等于研究者已线下确认
  - 研究者线下确认需转为结构化记录
- id: ae_sae_cm_hint
  name: 升级提示
  type: core
  description: 针对AE/SAE/CM疑似线索的升级提示、SLA倒计时和材料清单，仅辅助人工确认，不自动判定或上报
  attributes:
  - name: hint_status
    type: enum
    values:
    - detected
    - pending_confirm
    - confirmed_needed
    - dismissed
    - submitted
    description: 升级提示状态
  - name: sla_deadline
    type: datetime
    description: 上报截止时间
  - name: material_checklist
    type: string
    description: 上报材料清单
  key_distinctions:
  - 升级提示不等于AE/SAE/CM最终判定
  - SLA倒计时不替代人工确认
  - 材料齐全不等于上报已提交
- id: action_recommendation
  name: 动作建议
  type: core
  description: 面向CRC的下一步动作、优先级、截止时间和关闭标准（仅CRC可执行动作，不含研究者侧操作）
  attributes:
  - name: action_type
    type: enum
    values:
    - supplement_doc
    - contact_doctor
    - check_subject
    - prepare_report
    - update_status
    description: 建议动作类型
  - name: action_status
    type: enum
    values:
    - suggested
    - accepted
    - rejected
    - deferred
    - completed
    description: CRC对动作建议的处理状态
  - name: close_criteria
    type: string
    description: 动作关闭所需证据
  key_distinctions:
  - 动作建议不等于系统自动执行
  - CRC接受建议后仍需完成证据留痕
  - 动作关闭不等于医学风险消失
- id: crc_feedback
  name: CRC反馈
  type: event
  description: CRC对提醒和判断建议的采纳、修正、误报、漏报和关闭反馈，用于规则和模型复盘
  attributes:
  - name: feedback_type
    type: enum
    values:
    - accepted
    - rejected
    - corrected
    - false_positive
    - false_negative
    - completed
    description: 反馈类型
  - name: correction_reason
    type: string
    description: CRC修正原因
  - name: created_at
    type: datetime
    description: 反馈时间
  key_distinctions:
  - CRC忽略提醒不等于提醒无效
  - 误报反馈需人工复核后进入规则优化
  - 反馈样本不能直接作为临床真值
- id: sop_rule
  name: SOP规则
  type: reference
  description: 项目方案、SOP、CTCAE阈值、升级条件和关闭标准的结构化规则，作为风险解释与动作关闭的知识依据
  attributes:
  - name: rule_type
    type: enum
    values:
    - review_trigger
    - ae_sae_cm
    - threshold
    - closure
    description: 规则类型
  - name: rule_source
    type: string
    description: 规则来源文档（如CTCAE v5.0、项目SOP）
  - name: exception_condition
    type: string
    description: 例外条件
  key_distinctions:
  - SOP规则解释不等于最终合规结论
  - 通用规则不能覆盖项目特例
  - 无引用来源的规则不能用于强提醒
relationships:
- from: patient
  to: subject_visit
  label: 管理
  cardinality: 1:N
  description: 受试者的一次或多次访视实例
- from: subject_visit
  to: source_document
  label: 记录
  cardinality: 1:N
  description: 一次访视记录多份源资料
- from: source_document
  to: lab_indicator
  label: 记录
  cardinality: 1:N
  description: 一份检查单/化验单含多个检验指标
- from: lab_indicator
  to: sop_rule
  label: 匹配
  cardinality: N:N
  description: 检验指标对照CTCAE/项目阈值与规则，产生候选等级
- from: lab_indicator
  to: risk_signal
  label: 支撑
  cardinality: N:1
  description: 异常检验指标与症状共同支撑风险信号
- from: subject_visit
  to: risk_signal
  label: 触发
  cardinality: 1:N
  description: 同一次访视可触发受试者状态或升级类风险信号
- from: risk_signal
  to: review_packet
  label: 触发
  cardinality: N:1
  description: 临床类风险信号触发复核证据包整理
- from: risk_signal
  to: ae_sae_cm_hint
  label: 触发
  cardinality: N:N
  description: 疑似安全事件线索触发AE/SAE/CM升级提示
- from: risk_signal
  to: action_recommendation
  label: 触发
  cardinality: N:N
  description: 风险信号转译CRC下一步动作建议
- from: ae_sae_cm_hint
  to: action_recommendation
  label: 触发
  cardinality: N:N
  description: 升级提示生成升级准备任务
- from: action_recommendation
  to: crc_feedback
  label: 记录
  cardinality: 1:N
  description: 动作建议记录CRC采纳、修正或关闭反馈
- from: crc_feedback
  to: sop_rule
  label: 记录
  cardinality: N:N
  description: 反馈经研究者/组长复核后记录为规则优化候选
action_boundaries:
- id: ab_next_action
  situation: CRC打开受试者访视
  situation_description: CRC进入某受试者访视，需要知道当前最应处理的下一步动作
  required_evidence:
  - source: 受试者访视实例
    checks: 访视存在且属于当前CRC或其负责中心
  - source: 访视资料状态
    checks: 资料缺失、上传、复核、归档状态已读取
  - source: 风险信号列表
    checks: 风险信号已匹配规则依据和严重程度
  valid_actions:
  - 汇总当前访视风险和待办动作
  - 排序CRC下一步动作优先级
  - 展示每个动作的依据和关闭标准
  - 记录CRC接受、暂缓或修正反馈
  invalid_actions:
  - action: 自动替CRC关闭访视
    reason: 访视关闭必须基于CRC确认和关闭证据
  - action: 无规则依据时推送强制动作
    reason: 无可追溯依据会造成错误执行
  - action: 将风险评分解释为医学严重程度
    reason: 执行优先级和临床严重性不是同一概念
  exception_triggers:
  - condition: 关键输入缺失且无法确认风险等级
    action: 降级为资料补齐提醒并要求CRC补充信息
  - condition: 同一访视存在critical风险和逾期SLA
    action: 置顶提醒并要求人工确认是否进入升级链路
- id: ab_subject_abnormal
  situation: 受试者状态出现异常线索
  situation_description: 检验指标、症状或既往访视对比提示可能需要整理复核证据
  required_evidence:
  - source: 检验指标
    checks: 监测值与趋势已结构化，含CTCAE候选等级
  - source: 项目方案和SOP
    checks: 异常阈值、复核触发条件和例外条件已匹配
  - source: 历史访视记录
    checks: 已对比既往访视表现和趋势变化
  valid_actions:
  - 提示异常线索和变化趋势
  - 建议是否发起研究者复核
  - 生成待研究者线下确认的问题清单
  - 标注AI判断置信度和依据来源
  invalid_actions:
  - action: 输出最终临床判定结论
    reason: AI只能辅助判断，不能替代临床判定
  - action: 直接判定受试者是否安全
    reason: 安全判断需研究者线下确认
  - action: 隐藏低置信度或依据不足提示
    reason: 证据不足必须显式披露给CRC
  exception_triggers:
  - condition: 异常线索置信度低但涉及受试者安全
    action: 标记为需人工复核而非忽略
  - condition: 关键监测值缺失或格式异常
    action: 提示CRC补充或核对原始记录
- id: ab_review_packet
  situation: CRC发起研究者复核
  situation_description: CRC准备向研究者提交复核材料，需要证据包和留痕
  required_evidence:
  - source: 风险信号
    checks: 异常线索、严重等级和规则依据已生成
  - source: 检验指标与原始资料
    checks: 监测值、症状、检测指标变化和沟通记录可追溯
  - source: 研究者复核记录
    checks: 复核结论、时间、参与人和后续指令可记录
  valid_actions:
  - 生成复核证据包草稿
  - 列出待研究者线下确认的问题
  - 记录研究者复核结论和后续动作
  - 将复核结论关联到受试者访视
  invalid_actions:
  - action: 伪造或补写研究者线下确认结论
    reason: 复核结论必须来自可追溯人工确认
  - action: 用AI摘要替代原始证据
    reason: 摘要只能辅助阅读，不能替代原始资料
  - action: 证据包未确认就进入升级提交
    reason: 升级需要明确证据和人工确认
  exception_triggers:
  - condition: 研究者复核结论与AI建议不一致
    action: 以研究者线下确认结论为准并记录差异原因
  - condition: 复核后要求补充资料
    action: 生成补充资料待办并保持复核状态未关闭
- id: ab_ae_sae_cm
  situation: 出现AE/SAE/CM疑似线索
  situation_description: 检验指标、症状或研究者复核结论中出现可能触发安全事件上报的线索
  required_evidence:
  - source: AE/SAE/CM规则
    checks: 项目上报规则、SLA和材料清单已匹配
  - source: 研究者复核结论
    checks: 复核结论或人工确认状态已记录
  - source: 风险台账
    checks: 是否已有同一事件的升级记录，避免重复
  valid_actions:
  - 提示疑似AE/SAE/CM线索
  - 展示SLA倒计时和材料清单
  - 要求研究者人工确认事件性质
  - 生成升级准备任务而非自动提交
  invalid_actions:
  - action: 自动判定AE/SAE/CM成立
    reason: 安全事件成立需人工和合规确认
  - action: 自动提交上报
    reason: MVP边界不允许AI替代人工上报
  - action: 因资料不全而取消升级提示
    reason: 资料不全应触发补齐任务而非忽略风险
  exception_triggers:
  - condition: SLA剩余时间低于预设阈值
    action: 升级为critical提醒并要求人工确认
  - condition: 疑似线索与既有事件重复
    action: 提示可能重复并要求人工合并或驳回
- id: ab_feedback_learning
  situation: CRC处理AI提醒后
  situation_description: CRC接受、暂缓、修正、忽略或完成动作建议后，需要形成反馈闭环
  required_evidence:
  - source: 动作建议记录
    checks: 建议ID、触发风险、推送时间和动作内容存在
  - source: CRC操作记录
    checks: 采纳、修正、暂缓、忽略或完成状态已记录
  - source: 风险结果
    checks: 风险是否关闭、是否误报漏报、是否进入升级已记录
  valid_actions:
  - 记录CRC对提醒的处理结果
  - 标注误报、漏报和修正原因
  - 将反馈送入规则优化候选队列
  - 保留研究者/组长复核后再更新规则
  invalid_actions:
  - action: 直接用单次反馈修改规则
    reason: 单次反馈可能带有偶然性和主观偏差
  - action: 把忽略提醒视为模型错误
    reason: 忽略原因需区分忙碌、无效或已处理
  - action: 将CRC反馈作为临床真值
    reason: 临床真值需要研究者或质控确认
  exception_triggers:
  - condition: 同类提醒连续被标注误报
    action: 进入规则复核队列并降低推送强度
  - condition: 发生漏报且后续进入升级链路
    action: 标记为高优先级模型和规则复盘样本
workstreams:
- id: ws_risk_detection
  name: 风险识别
  description: 从受试者访视进入，到抽取检验指标、汇聚上下文、识别风险信号并形成可解释风险卡
  anchor_objects:
  - subject_visit
  - source_document
  - lab_indicator
  - risk_signal
  - sop_rule
  states:
  - id: rd_context_pending
    name: 待汇聚
    description: 受试者访视存在，但时间线、资料状态和检验指标尚未汇聚
    transitions:
    - to_state: rd_context_ready
      trigger_action: 汇聚访视上下文
      required_evidence: 访视实例、资料状态、检验指标已读取
      type: normal
    - to_state: rd_context_blocked
      trigger_action: 检查输入完整性
      required_evidence: 关键资料缺失或指标无法识别
      type: exception
  - id: rd_context_ready
    name: 上下文就绪
    description: 访视上下文已汇聚，检验指标已抽取并对照规则，可进行风险信号识别
    transitions:
    - to_state: rd_signal_detected
      trigger_action: 识别风险信号
      required_evidence: 至少一个风险信号命中受试者异常或升级规则
      type: normal
    - to_state: rd_no_signal
      trigger_action: 完成风险扫描
      required_evidence: 未命中高频风险规则，且关键资料完整
      type: normal
  - id: rd_signal_detected
    name: 已识别
    description: 已识别风险信号，等待规则解释和动作转译
    transitions:
    - to_state: rd_explained
      trigger_action: 匹配规则依据
      required_evidence: 风险信号已关联SOP规则、CTCAE阈值或原始证据
      type: normal
    - to_state: rd_context_blocked
      trigger_action: 检查依据完整性
      required_evidence: 风险信号缺少规则来源或原始证据
      type: exception
  - id: rd_explained
    name: 已解释
    description: 风险信号具备依据、严重等级和置信度，可进入动作提醒
    transitions: []
  - id: rd_no_signal
    name: 暂无风险
    description: 本轮扫描未发现需提醒风险，但仍可被新数据重新触发
    transitions:
    - to_state: rd_signal_detected
      trigger_action: 监听新资料或新记录
      required_evidence: 新增资料、指标或状态变化触发风险规则
      type: recovery
  - id: rd_context_blocked
    name: 信息不足
    description: 关键输入缺失或依据不足，不能生成强风险判断
    transitions:
    - to_state: rd_context_ready
      trigger_action: CRC补充或系统同步数据
      required_evidence: 缺失字段或资料状态已补齐
      type: recovery
  guardrails:
  - 风险判断必须保留来源证据和规则依据
  - 信息不足时只能提示补齐，不能生成强结论
  - AI风险信号不能替代临床或合规最终判断
  dependency_mapping:
  - workstream: ws_next_action
    condition: 风险识别达到已解释状态
    impact: 允许生成CRC下一步动作建议
  - workstream: ws_review_upgrade
    condition: 识别到受试者异常或AE/SAE/CM线索
    impact: 触发复核证据包或升级提示流程
- id: ws_next_action
  name: 动作提醒
  description: 将已解释风险转化为CRC可执行、可反馈、可关闭的下一步动作
  anchor_objects:
  - risk_signal
  - action_recommendation
  - subject_visit
  - crc_feedback
  states:
  - id: na_waiting_signal
    name: 等待风险
    description: 尚无已解释风险，不能生成强动作建议
    transitions:
    - to_state: na_suggested
      trigger_action: 转译下一步动作
      required_evidence: 风险信号处于已解释状态且匹配动作模板
      type: normal
  - id: na_suggested
    name: 已建议
    description: 系统已向CRC展示动作建议、优先级、依据和关闭标准
    transitions:
    - to_state: na_accepted
      trigger_action: CRC接受建议
      required_evidence: CRC点击接受或开始处理该动作
      type: normal
    - to_state: na_deferred
      trigger_action: CRC暂缓建议
      required_evidence: CRC选择暂缓并记录原因或计划处理时间
      type: normal
    - to_state: na_rejected
      trigger_action: CRC驳回建议
      required_evidence: CRC选择驳回并填写原因
      type: exception
  - id: na_accepted
    name: 已接受
    description: CRC已接受建议，动作进入执行中
    transitions:
    - to_state: na_completed
      trigger_action: CRC提交关闭证据
      required_evidence: 补传资料、研究者复核记录、状态更新或其他关闭证据存在
      type: normal
    - to_state: na_deferred
      trigger_action: CRC记录阻塞原因
      required_evidence: 存在无法执行原因，如资料缺失或等待研究者复核
      type: exception
  - id: na_deferred
    name: 已暂缓
    description: CRC暂缓处理，系统保留提醒和后续触发条件
    transitions:
    - to_state: na_accepted
      trigger_action: CRC重新开始处理
      required_evidence: 暂缓原因解除或截止时间临近
      type: recovery
  - id: na_rejected
    name: 已驳回
    description: CRC认为建议不适用或为误报，需要进入反馈复核
    transitions:
    - to_state: na_feedback_recorded
      trigger_action: 记录驳回反馈
      required_evidence: 驳回原因、误报标注或修正建议已填写
      type: recovery
  - id: na_completed
    name: 已完成
    description: CRC已完成动作并提交关闭证据
    transitions:
    - to_state: na_feedback_recorded
      trigger_action: 采集动作结果
      required_evidence: 动作状态、关闭证据和风险结果已记录
      type: normal
  - id: na_feedback_recorded
    name: 已反馈
    description: 动作结果进入反馈闭环，用于规则和模型复盘
    transitions: []
  guardrails:
  - 动作建议必须有风险来源和关闭标准
  - AI不能绕过CRC确认直接执行或关闭任务
  - CRC驳回必须记录原因，不能静默删除样本
  dependency_mapping:
  - workstream: ws_feedback_learning
    condition: 动作提醒达到已完成或已驳回状态
    impact: 触发提醒有效性与误报漏报标注
  - workstream: ws_review_upgrade
    condition: 动作建议要求研究者复核或AE/SAE/CM确认
    impact: 触发复核证据包和升级提示流程
- id: ws_review_upgrade
  name: 复核升级
  description: 从异常线索到复核证据包、研究者线下确认、AE/SAE/CM升级提示和人工确认
  anchor_objects:
  - risk_signal
  - review_packet
  - ae_sae_cm_hint
  - sop_rule
  states:
  - id: ru_signal_pending
    name: 待判断
    description: 存在异常线索，但尚未明确是否需要复核或升级
    transitions:
    - to_state: ru_review_packet_ready
      trigger_action: 生成复核证据包
      required_evidence: 异常线索、检验指标、原始资料和规则依据已汇总
      type: normal
    - to_state: ru_upgrade_pending
      trigger_action: 检测AE/SAE/CM疑似线索
      required_evidence: 线索命中AE/SAE/CM规则或SLA触发条件
      type: exception
  - id: ru_review_packet_ready
    name: 证据包就绪
    description: 复核证据包草稿已生成，等待CRC提交或修正
    transitions:
    - to_state: ru_review_submitted
      trigger_action: CRC提交研究者复核
      required_evidence: CRC确认并提交证据包
      type: normal
    - to_state: ru_signal_pending
      trigger_action: CRC要求补充证据
      required_evidence: CRC标记资料缺失或问题清单不完整
      type: recovery
  - id: ru_review_submitted
    name: 已提交复核
    description: 研究者正在线下复核，AI等待人工结论
    transitions:
    - to_state: ru_review_confirmed
      trigger_action: 记录研究者复核结论
      required_evidence: 研究者复核结论、时间、参与人已记录
      type: normal
    - to_state: ru_upgrade_pending
      trigger_action: 复核结论触发升级
      required_evidence: 研究者线下确认结论或规则匹配显示需进入AE/SAE/CM确认
      type: exception
  - id: ru_review_confirmed
    name: 复核已确认
    description: 研究者复核结论已留痕，可更新动作建议和访视状态
    transitions: []
  - id: ru_upgrade_pending
    name: 待升级确认
    description: 存在AE/SAE/CM疑似线索或SLA风险，必须人工确认
    transitions:
    - to_state: ru_upgrade_confirmed
      trigger_action: 人工确认需升级
      required_evidence: CRC、项目经理或质控确认升级需要和材料清单
      type: normal
    - to_state: ru_upgrade_dismissed
      trigger_action: 人工确认不升级
      required_evidence: 驳回原因和依据已记录
      type: recovery
  - id: ru_upgrade_confirmed
    name: 升级确认
    description: 人工确认需要进入上报准备或正式流程
    transitions:
    - to_state: ru_submitted
      trigger_action: 完成上报提交
      required_evidence: 上报记录或工作台提交状态存在
      type: normal
  - id: ru_upgrade_dismissed
    name: 升级驳回
    description: 人工确认不进入升级，但原因必须留痕
    transitions: []
  - id: ru_submitted
    name: 已上报
    description: AE/SAE/CM相关上报已通过人工确认后提交
    transitions: []
  guardrails:
  - AI不得输出判定或最终安全事件成立结论
  - AI不得自动提交AE/SAE/CM上报
  - SLA临近时必须提醒人工确认，不能静默等待
  - 研究者线下确认结论与AI建议冲突时以研究者线下确认结论为准
  dependency_mapping:
  - workstream: ws_next_action
    condition: 复核或升级流程需要CRC补充资料
    impact: 生成新的CRC补充资料动作建议
  - workstream: ws_feedback_learning
    condition: 升级提示被确认、驳回或提交
    impact: 形成高价值反馈样本用于规则复盘
- id: ws_feedback_learning
  name: 反馈学习
  description: 采集CRC反馈、误报漏报和关闭结果，进入规则优化候选队列
  anchor_objects:
  - action_recommendation
  - crc_feedback
  - sop_rule
  states:
  - id: fl_waiting_feedback
    name: 待反馈
    description: 动作建议已推送，但尚未采集CRC处理结果
    transitions:
    - to_state: fl_feedback_recorded
      trigger_action: CRC提交反馈
      required_evidence: 采纳、驳回、修正、完成或误报漏报标注已记录
      type: normal
  - id: fl_feedback_recorded
    name: 已记录
    description: CRC反馈已写入风险台账或反馈表
    transitions:
    - to_state: fl_review_needed
      trigger_action: 判断反馈是否需复核
      required_evidence: 反馈为误报、漏报、规则冲突或安全相关
      type: exception
    - to_state: fl_closed
      trigger_action: 归档普通反馈
      required_evidence: 反馈无争议且动作已关闭
      type: normal
  - id: fl_review_needed
    name: 待复核
    description: 反馈影响规则、模型或安全判断，需要质控或项目人员复核
    transitions:
    - to_state: fl_candidate_update
      trigger_action: 质控确认可优化
      required_evidence: 复核结论显示规则、模板或模型需要调整
      type: normal
    - to_state: fl_closed
      trigger_action: 质控确认不调整
      required_evidence: 复核结论显示反馈不适用于规则更新
      type: recovery
  - id: fl_candidate_update
    name: 优化候选
    description: 反馈样本进入规则、案例或模型优化候选池
    transitions:
    - to_state: fl_closed
      trigger_action: 完成知识库或规则更新
      required_evidence: 规则版本、案例模板或模型样本更新记录存在
      type: normal
  - id: fl_closed
    name: 已归档
    description: 反馈已归档或进入优化记录，闭环完成
    transitions: []
  guardrails:
  - 单次反馈不能直接修改线上规则
  - 误报漏报样本需人工复核后再进入训练
  - 临床相关反馈不能作为未经确认的真值
  dependency_mapping:
  - workstream: ws_risk_detection
    condition: 规则或模型优化候选被确认
    impact: 后续风险识别阈值或解释依据可更新
  - workstream: ws_next_action
    condition: 处置模板被更新
    impact: 后续CRC动作建议可引用新模板
