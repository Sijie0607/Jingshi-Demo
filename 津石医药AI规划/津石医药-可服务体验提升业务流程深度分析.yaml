title: "津石医药-可服务体验提升业务流程深度分析"
company: "津石医药"
domain: "CRC日常现场执行服务体验"
description: "基于最新北极星指标“月度高质量受试者访视闭环数”，围绕全面提升可服务体验，将日常现场执行拆分为两类业务：重复操作的自动化填入链路，以及风险管理预测与智能提醒的知识型链路。"

business_types:
  - name: "重复操作自动化填入服务"
    model: "B2B专业服务"
    product_type: "AI流程自动化服务"
    market_type: "存量效率优化市场"
    description: "面向CRC、项目经理、药物管理员和质控团队，把访视资料上传、脱敏、结构化、补录、导出、归档等重复动作自动化，减少低价值手工劳动。核心价值是让每次访视资料更快、更完整、更可追溯。"
  - name: "风险管理预测与智能提醒服务"
    model: "B2B专业服务"
    product_type: "知识型决策支持服务"
    market_type: "质量合规垂直市场"
    description: "面向CRC、研究者、项目经理、质控专员和客户经理，把访视异常、资料缺失、AE/SAE/CM风险、中心执行偏差和客户关切前置识别。核心价值是把依赖个人经验的判断转化为可解释、可追踪、可升级的风险管理链路。"

l1_value_streams:
  - name: "访视资料自动填入与复核归档价值流"
    business_type: "重复操作自动化填入服务"
    description: "从访视任务触发开始，到资料上传、脱敏、结构化、复核、导出、归档和申办方可追溯结束，目标是降低CRC重复操作并提升访视资料闭环质量。"
    stages:
      - name: "访视任务触发与资料准备"
        order: 1
        type: "process"
        description: "根据项目计划、受试者访视安排和中心待办，明确本次访视需要采集和处理的资料。"
        l2_processes:
          - name: "访视资料清单生成"
            role: "CRC"
            system: "CTMS/日程工具/项目台账"
            inputs:
              - "项目计划"
              - "受试者访视安排"
              - "中心待办事项"
            outputs:
              - "本次访视资料清单"
              - "待上传文件列表"
            description: "自动识别本次访视需要准备的病历、化验单、影像、用药记录、访视记录等资料。"
            order: 1
            pain_points:
              - severity: "high"
                description: "CRC需要手工判断每次访视应准备哪些资料，不同项目要求容易混淆。"
                impact: "资料漏传、补传和返工增加，影响访视闭环效率。"
                root_cause: "项目方案要求、访视窗口和资料模板未被系统化映射。"
          - name: "资料收集与批量上传"
            role: "CRC"
            system: "文档智能识别/脱敏工具"
            inputs:
              - "病历"
              - "化验单"
              - "影像报告"
              - "用药记录"
              - "访视记录"
            outputs:
              - "上传文件包"
              - "文件类型识别结果"
            description: "将多类访视资料按受试者、访视、文档类型批量上传。"
            order: 2
            pain_points:
              - severity: "critical"
                description: "资料分散、文件名不统一，CRC需要逐份上传和归类。"
                impact: "重复劳动占用大量一线时间，文件错归类会影响后续复核和申办方查阅。"
                root_cause: "缺少统一的受试者-访视-文档类型命名和自动识别机制。"
      - name: "脱敏与结构化填入"
        order: 2
        type: "process"
        description: "对原始资料进行敏感信息识别、脱敏、字段抽取和结构化填入。"
        l2_processes:
          - name: "敏感信息自动识别与脱敏"
            role: "CRC/合规负责人"
            system: "脱敏工具/审计日志"
            inputs:
              - "上传文件包"
              - "敏感字段规则"
            outputs:
              - "已脱敏资料"
              - "脱敏审计记录"
            description: "识别姓名、身份证、手机号、住院号、床位号等敏感信息并自动遮挡。"
            order: 1
            pain_points:
              - severity: "critical"
                description: "人工逐页脱敏容易遗漏敏感信息。"
                impact: "隐私合规风险升高，申办方复核和稽查风险加大。"
                root_cause: "敏感信息识别仍依赖人工经验，缺少高准确率识别和留痕审计。"
          - name: "访视结果结构化填入"
            role: "CRC"
            system: "AE/SAE/CM工作台/结构化识别引擎"
            inputs:
              - "已脱敏资料"
              - "项目字段模板"
              - "访视类型"
            outputs:
              - "结构化字段结果"
              - "待复核数据表"
            description: "把访视资料中的AE、SAE、CM、用药、检查结果等信息自动填入结构化表单。"
            order: 2
            pain_points:
              - severity: "high"
                description: "CRC需要重复录入和整理不同访视结果。"
                impact: "录入耗时长，疲劳出错会导致后续EDC录入和申办方复核质疑。"
                root_cause: "原始资料到结构化表单之间缺少稳定抽取和字段映射能力。"
      - name: "人工复核与导出归档"
        order: 3
        type: "process"
        description: "CRC对AI结果进行左图右表复核，确认后自动导出、命名、归档并生成可追溯记录。"
        l2_processes:
          - name: "左图右表复核"
            role: "CRC/QA"
            system: "可视化复核界面"
            inputs:
              - "原始图像"
              - "结构化字段结果"
            outputs:
              - "复核确认记录"
              - "修正记录"
            description: "对照原始资料确认AI识别结果，修正不准确或缺失字段。"
            order: 1
            pain_points:
              - severity: "high"
                description: "复核标准依赖CRC个人经验，修正原因不易沉淀。"
                impact: "同类错误重复出现，后续模型优化和培训难以闭环。"
                root_cause: "复核动作没有转化为结构化反馈和案例知识。"
          - name: "自动导出与归档"
            role: "CRC/项目经理"
            system: "导出文件管理/eTMF/文档库"
            inputs:
              - "复核确认记录"
              - "结构化数据表"
              - "命名规则"
            outputs:
              - "导出文件"
              - "归档记录"
              - "审计日志"
            description: "自动生成Excel/CSV/报告文件，并按项目、受试者、访视、中心归档。"
            order: 2
            pain_points:
              - severity: "medium"
                description: "导出、命名、归档仍存在人工操作和项目模板差异。"
                impact: "文件版本混乱、查找困难，影响申办方/CRA一次复核通过率。"
                root_cause: "导出物管理未与访视状态和审计链完全绑定。"

  - name: "访视风险预测与智能提醒价值流"
    business_type: "风险管理预测与智能提醒服务"
    description: "从访视计划、受试者状态、资料完整性和现场沟通进入风险监测开始，到风险评分、动作提醒、医生复核、项目升级、客户透明同步和经验回流结束，目标是把风险管理从事后补救转为前置预警，并让客户感知到津石对过程质量的主动控制能力。"
    stages:
      - name: "风险信号采集与证据建模"
        order: 1
        type: "process"
        description: "把访视计划、受试者状态、资料上传、现场沟通和历史偏差转换为可计算、可追溯的风险证据。"
        l2_processes:
          - name: "访视事件时间线生成"
            role: "CRC/项目经理"
            system: "CTMS/风险台账/进度看板"
            inputs:
              - "访视安排"
              - "执行记录"
              - "资料上传状态"
              - "中心沟通记录"
            outputs:
              - "访视事件时间线"
              - "关键节点状态视图"
            description: "按项目、中心、受试者和访视维度，将预约、到访、采样、资料上传、复核和沟通动作串成同一条时间线。业务价值是让项目经理和质控人员不用再从多个系统和群消息中还原现场事实。"
            order: 1
            pain_points:
              - severity: "critical"
                description: "访视事实分散在CTMS、文档库、沟通群和个人记录中，难以形成统一时间线。"
                impact: "风险通常在问题显性化后才被发现，错过访视前或访视中干预窗口。"
                root_cause: "项目过程数据缺少统一事件模型，字段口径和时间戳没有被标准化。"
          - name: "资料完整性信号采集"
            role: "CRC/质控专员"
            system: "eTMF/文档库/自动归档模块"
            inputs:
              - "访视资料清单"
              - "已上传文件"
              - "复核状态"
              - "导出归档记录"
            outputs:
              - "资料缺失清单"
              - "资料时效风险标签"
              - "版本不一致提示"
            description: "围绕访视资料是否齐全、是否及时、是否版本一致形成风险信号。业务价值是把检查前集中返工提前到访视过程内处理。"
            order: 2
            pain_points:
              - severity: "high"
                description: "资料完整性问题通常在质控或申办方复核时才暴露。"
                impact: "关键文档准时完整率不稳定，影响申办方复核一次通过率。"
                root_cause: "资料清单、上传状态、复核状态和归档状态未形成自动校验链。"
          - name: "受试者状态风险信号采集"
            role: "CRC/研究者"
            system: "访视记录表/临床判断备忘/AE工作台"
            inputs:
              - "受试者监测值"
              - "症状变化"
              - "用药变化"
              - "既往访视表现"
            outputs:
              - "受试者状态风险标签"
              - "需医生复核提示"
              - "AE/SAE/CM线索"
            description: "识别受试者数值变化、症状变化、用药变化和潜在AE/SAE/CM线索。业务价值是把依赖CRC经验的口头预判变成可留痕的结构化风险输入。"
            order: 3
            pain_points:
              - severity: "critical"
                description: "临床状态预判依赖个人经验和口头反复确认，缺少结构化证据。"
                impact: "异常响应可能延迟，受试者体验、安全感和合规追溯都受到影响。"
                root_cause: "受试者状态没有与项目方案、AE规则和医生复核动作形成统一判断模板。"

      - name: "风险规则匹配与评分解释"
        order: 2
        type: "decision"
        description: "将风险信号与项目SOP、历史偏差、AE/SAE/CM规则和中心执行表现进行匹配，输出可解释的风险等级。"
        l2_processes:
          - name: "风险规则与SOP匹配"
            role: "质控专员/项目经理"
            system: "风险规则库/SOP知识库"
            inputs:
              - "访视事件时间线"
              - "资料缺失清单"
              - "受试者状态风险标签"
              - "SOP要求"
            outputs:
              - "风险命中规则"
              - "规则依据说明"
              - "下一步处理建议"
            description: "把资料缺失、访视超窗、临床异常、AE/SAE/CM线索与项目SOP进行匹配，形成可解释的风险依据。业务价值是让提醒不仅告诉一线“有风险”，还解释“为什么有风险”。"
            order: 1
            pain_points:
              - severity: "high"
                description: "风险提示缺少规则依据时，一线很难判断是否需要立即处理。"
                impact: "提醒容易被忽略，或者造成过度升级，降低现场使用体验。"
                root_cause: "SOP、方案要求和历史偏差没有被拆成机器可匹配的规则。"
          - name: "访视级风险评分"
            role: "项目经理/质控专员"
            system: "风险评分模型/质控看板"
            inputs:
              - "风险命中规则"
              - "历史异常记录"
              - "中心执行表现"
              - "CRC负荷状态"
            outputs:
              - "访视风险等级"
              - "风险贡献因子"
              - "优先处理清单"
            description: "为每个访视生成风险等级，并解释由哪些因素推动风险升高。业务价值是帮助项目经理和质控团队把资源优先投向最可能影响高质量闭环的访视。"
            order: 2
            pain_points:
              - severity: "critical"
                description: "当前缺少对访视级风险的动态评分和贡献因子解释。"
                impact: "质控资源无法精准投向高风险访视，重大偏差更难提前拦截。"
                root_cause: "过程数据没有被连续监测，风险模型与现场动作之间没有闭环。"
          - name: "相似案例与处理模板推荐"
            role: "质控专员/培训负责人"
            system: "案例知识库/学习App"
            inputs:
              - "风险贡献因子"
              - "历史偏差案例"
              - "CAPA案例"
              - "客户质疑记录"
            outputs:
              - "相似案例"
              - "处理动作模板"
              - "注意事项"
            description: "根据风险原因推荐历史相似案例和处理模板。业务价值是把资深CRC和质控人员的经验变成新人也能调用的行动知识。"
            order: 3
            pain_points:
              - severity: "high"
                description: "风险处置建议依赖资深人员记忆，案例复用效率低。"
                impact: "同类风险在不同中心重复发生，新人处理质量波动大。"
                root_cause: "偏差、CAPA和客户反馈没有按场景和动作标签沉淀。"

      - name: "智能提醒与任务编排"
        order: 3
        type: "process"
        description: "把风险评分和规则依据转化为CRC、项目经理、研究者、质控专员可执行的任务提醒。"
        l2_processes:
          - name: "CRC下一步动作提醒"
            role: "CRC"
            system: "CRC Copilot/移动端提醒"
            inputs:
              - "访视风险等级"
              - "规则依据说明"
              - "待办事项"
              - "现场工作负荷"
            outputs:
              - "行动提醒"
              - "催办任务"
              - "复核建议"
            description: "将风险评分转化为CRC可以立即执行的动作，例如补传资料、联系研究者、确认症状变化、发起AE复核或更新访视状态。业务价值是减少CRC在高压现场中自行判断优先级的负担。"
            order: 1
            pain_points:
              - severity: "high"
                description: "提醒如果只停留在风险提示，不能转化为具体动作。"
                impact: "CRC仍需自己判断下一步，智能提醒对体验改善有限。"
                root_cause: "风险模型和现场任务编排没有形成一一对应关系。"
          - name: "跨角色协同提醒"
            role: "CRC/研究者/项目经理"
            system: "沟通群/协同待办/客户协同门户"
            inputs:
              - "行动提醒"
              - "责任角色"
              - "升级规则"
              - "截止时间"
            outputs:
              - "分角色待办"
              - "协同通知"
              - "升级倒计时"
            description: "把同一风险拆成CRC、研究者、项目经理和质控专员的分角色任务。业务价值是减少重复通知和责任不清，让风险协同更快进入处理状态。"
            order: 2
            pain_points:
              - severity: "high"
                description: "现场问题常靠CRC重复通知各角色推进。"
                impact: "问题处理链路长，异常响应滞后，影响受试者和申办方体验。"
                root_cause: "风险责任归属、通知节奏和升级阈值没有被系统化编排。"
          - name: "提醒有效性反馈"
            role: "CRC/项目经理"
            system: "CRC Copilot/风险看板"
            inputs:
              - "提醒触达记录"
              - "任务完成状态"
              - "风险结果"
              - "用户反馈"
            outputs:
              - "提醒有效性记录"
              - "规则优化线索"
              - "误报漏报清单"
            description: "记录提醒是否被执行、是否降低风险、是否产生误报或漏报。业务价值是让智能提醒持续变准，而不是一次性规则配置。"
            order: 3
            pain_points:
              - severity: "medium"
                description: "提醒效果缺少反馈，难以判断哪些提醒真正改善了闭环质量。"
                impact: "提醒过多会造成疲劳，提醒过少又无法提前拦截风险。"
                root_cause: "任务完成、风险结果和规则命中没有形成反馈学习机制。"

      - name: "临床复核与风险闭环"
        order: 4
        type: "process"
        description: "对可能影响受试者安全、AE/SAE/CM上报或重大偏差的风险进行医生复核、升级、纠偏和关闭。"
        l2_processes:
          - name: "临床异常预判与医生复核"
            role: "CRC/研究者"
            system: "访视记录表/临床判断备忘/沟通记录"
            inputs:
              - "受试者状态风险标签"
              - "受试者监测值"
              - "症状变化"
              - "风险规则依据"
            outputs:
              - "医生复核确认记录"
              - "后续行动指令"
              - "复核留痕"
            description: "将依赖口头沟通的临床异常判断转化为结构化复核流程。业务价值是让受试者异常响应更快，且每次判断都有证据和留痕。"
            order: 1
            pain_points:
              - severity: "critical"
                description: "受试者异常是否需要医生复核常依赖口头反复确认。"
                impact: "异常响应可能延迟，记录不完整会影响合规追溯。"
                root_cause: "缺少基于证据的预判模板和复核留痕机制。"
          - name: "AE/SAE/CM升级判断"
            role: "CRC/项目经理/质控专员"
            system: "AE/SAE/CM工作台/风险台账"
            inputs:
              - "医生复核确认记录"
              - "AE/SAE/CM线索"
              - "SLA规则"
              - "项目上报要求"
            outputs:
              - "升级判断结论"
              - "SLA倒计时"
              - "上报准备清单"
            description: "判断是否需要进入AE、SAE或CM升级链路，并明确时限和所需材料。业务价值是降低漏报、迟报和资料不完整风险。"
            order: 2
            pain_points:
              - severity: "critical"
                description: "AE/SAE/CM升级判断需要结合临床信息、项目规则和时限要求，人工判断压力高。"
                impact: "漏报或迟报会直接影响质量合规与客户信任。"
                root_cause: "安全事件线索、上报SLA和资料准备清单没有被统一联动。"
          - name: "纠偏动作闭环跟踪"
            role: "项目经理/质控专员"
            system: "风险台账/CAPA记录/客户协同门户"
            inputs:
              - "升级判断结论"
              - "纠偏动作"
              - "责任人"
              - "关闭证据"
            outputs:
              - "升级处理单"
              - "关闭记录"
              - "CAPA经验条目"
            description: "跟踪风险从发现、升级、处理到关闭的全过程。业务价值是让风险不只被发现，还能按时关闭并沉淀为组织能力。"
            order: 3
            pain_points:
              - severity: "high"
                description: "风险升级后缺少自动跟踪和闭环提醒。"
                impact: "风险处理容易拖延，客户难以及时感知津石的过程控制能力。"
                root_cause: "风险台账与客户同步、质控复核、CRC待办没有打通。"

      - name: "客户价值呈现与知识回流"
        order: 5
        type: "process"
        description: "把风险预测、提醒响应、纠偏结果和复盘经验转化为客户可感知的服务价值，以及内部可复用的知识资产。"
        l2_processes:
          - name: "客户视角风险同步"
            role: "客户经理/项目经理"
            system: "客户协同门户/阶段汇报"
            inputs:
              - "风险关闭记录"
              - "项目进度状态"
              - "纠偏动作"
              - "访视闭环指标"
            outputs:
              - "客户风险摘要"
              - "阶段汇报材料"
              - "服务价值说明"
            description: "自动生成客户关心的进度、风险、行动计划、关闭状态和津石主动预警价值。业务价值是让申办方不仅看到结果，也看到过程控制能力。"
            order: 1
            pain_points:
              - severity: "high"
                description: "客户汇报仍依赖人工拼接多个系统状态。"
                impact: "客户感知不到实时控制能力，协作体验和信任下降。"
                root_cause: "项目过程数据没有被产品化呈现。"
          - name: "风险运营指标复盘"
            role: "运营负责人/质控负责人"
            system: "经营看板/质控看板"
            inputs:
              - "风险评分分布"
              - "提醒触达记录"
              - "风险关闭时效"
              - "访视闭环结果"
            outputs:
              - "风险运营复盘"
              - "中心/CRC风险画像"
              - "流程优化建议"
            description: "复盘哪些中心、CRC、资料类型或访视节点最容易产生风险。业务价值是把单点风险处置升级为中心和人员能力治理。"
            order: 2
            pain_points:
              - severity: "medium"
                description: "风险复盘缺少经营视角，难以转化为资源配置和培训优先级。"
                impact: "培训和质控投入不够精准，核心CRC成长路径不清晰。"
                root_cause: "风险结果没有沉淀为中心画像、CRC画像和能力标签。"
          - name: "风险案例沉淀与训练"
            role: "培训负责人/质控负责人"
            system: "知识库/学习App"
            inputs:
              - "风险案例"
              - "复核记录"
              - "客户质疑记录"
              - "CAPA经验条目"
            outputs:
              - "案例知识条目"
              - "训练题库"
              - "规则优化建议"
            description: "把典型风险、纠偏动作、客户复核意见和CAPA经验转化为可复用知识。业务价值是让风险管理能力从少数骨干经验扩展为一线团队可复制的标准动作。"
            order: 3
            pain_points:
              - severity: "medium"
                description: "经验沉淀常停留在复盘文档，不能直接进入一线执行。"
                impact: "新人上手慢，同类问题在不同中心重复发生。"
                root_cause: "知识库没有与具体场景、动作和提醒规则绑定。"
