    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: var(--text);
        }
        .container {
            width: 90%;
            max-width: 1400px;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }
        h1 { font-size: 24px; margin: 0; }
        .controls {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            background: white;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn:hover { background: #f8fafc; border-color: var(--primary); color: var(--primary); }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            background: #4f46e5;
            color: white;
        }
        .viewer-wrapper {
            margin: 20px 0;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            min-height: 600px;
            overflow: hidden;
            position: relative;
        }
        #graph-container {
            width: 100%;
            height: 650px;
        }
        .footer {
            margin-top: 20px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }
        .hint {
            background: #f0fdf4;
            color: #166534;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #bbf7d0;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--muted);
        }
    </style>
</head>

    <script type="text/javascript" src="https://viewer.diagrams.net/js/viewer-static.min.js"></script>
    <script>
        window.onload = function() {
            const xml = document.getElementById('xml-source').innerHTML.trim();
            const container = document.getElementById('graph-container');
            
            // Explicitly create the viewer to avoid JSON encoding issues in data-mxgraph attribute
            const graphConfig = {
                highlight: "#6366f1",
                nav: true,
                resize: true,
                toolbar: "zoom layers lightbox",
                xml: xml
            };

            // Create div for mxgraph
            const mxDiv = document.createElement('div');
            mxDiv.className = 'mxgraph';
            mxDiv.style.width = '100%';
            mxDiv.style.height = '650px';
            mxDiv.setAttribute('data-mxgraph', JSON.stringify(graphConfig));
            
            container.appendChild(mxDiv);
            
            // Re-trigger Draw.io viewer initialization if needed, 
            // though viewer-static usually picks up new elements.
            if (window.GraphViewer && window.GraphViewer.createViewerForElement) {
                window.GraphViewer.createViewerForElement(mxDiv);
            }
            
            document.getElementById('loading-hint').style.display = 'none';
        };

        function copyXml() {
            const xml = document.getElementById('xml-source').innerHTML.trim();
            navigator.clipboard.writeText(xml).then(() => {
                alert('XML 已复制到剪贴板！');
            });
        }

        function openInDrawio() {
            const xml = document.getElementById('xml-source').innerHTML.trim();
            const blob = new Blob([xml], { type: 'application/xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'architecture.drawio';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
